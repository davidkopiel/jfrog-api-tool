[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jfrog-api-tool"
version = "0.1.0"
requires-python = ">=3.8"
dependencies = [
    "requests",
    "questionary",
    "rich",
    "cryptography"]

[project.scripts]

jfrog-api-tool = "jfrog_api_tool.main:main"

[tool.setuptools]
package-data = {"jfrog_api_tool" = ["apis.json"]}